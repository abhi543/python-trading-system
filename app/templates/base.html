<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ALGO-TRADE Pro | Financial Terminal{% endblock %}</title>
    <!-- Modern Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- TradingView Lightweight Charts CDN -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        :root {
            --bg-body: #07090e;
            --bg-card: #0e131f;
            --bg-surface: #141b2d;
            --bg-hover: #1b243b;
            --border: #1f293d;
            --border-highlight: #2e3c59;
            --text-main: #f3f6fc;
            --text-muted: #7e8ba6;
            --green: #00f090;
            --green-glow: rgba(0, 240, 144, 0.18);
            --red: #ff3366;
            --red-glow: rgba(255, 51, 102, 0.18);
            --blue: #00a3ff;
            --blue-glow: rgba(0, 163, 255, 0.18);
            --font-ui: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            width: 100%;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-ui);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1.25rem;
            background: linear-gradient(180deg, #101524 0%, #0c101c 100%);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 0.85rem;
            width: 100%;
            max-width: 100vw;
            box-sizing: border-box;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .logo-badge {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: linear-gradient(135deg, #00f090 0%, #00a3ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(0, 240, 144, 0.35);
        }

        .logo-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .logo-title span {
            color: var(--green);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.25rem 0.65rem;
            border-radius: 999px;
            background: rgba(0, 240, 144, 0.1);
            border: 1px solid rgba(0, 240, 144, 0.25);
            color: var(--green);
            letter-spacing: 0.05em;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: 1.5rem;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-link:hover {
            color: var(--text-main);
            background: var(--bg-surface);
        }

        .nav-link.active {
            color: #fff;
            background: rgba(0, 163, 255, 0.15);
            border: 1px solid rgba(0, 163, 255, 0.3);
        }

        .bot-nav-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse 1.5s infinite;
        }

        .nav-metrics {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .metric-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .metric-title {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .metric-value {
            font-family: var(--font-code);
            font-size: 1.05rem;
            font-weight: 700;
        }

        /* BUTTONS */
        .btn-reset {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-reset:hover {
            color: var(--text-main);
            border-color: var(--border-highlight);
            background: var(--bg-hover);
        }

        /* MAIN CONTAINER */
        .main-container {
            flex: 1;
            padding: 1rem 1.25rem 2.5rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-width: 1750px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 290px 1fr 310px;
            gap: 1.25rem;
            min-height: 520px;
        }

        /* CARDS / PANELS */
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1.15rem;
            background: rgba(20, 27, 45, 0.6);
            border-bottom: 1px solid var(--border);
        }

        .panel-header h3 {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* WATCHLIST */
        .add-symbol-form {
            display: flex;
            gap: 0.4rem;
        }

        .add-symbol-form input {
            width: 95px;
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.35rem 0.6rem;
            border-radius: 6px;
            font-family: var(--font-code);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .add-symbol-form input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 8px var(--blue-glow);
        }

        .btn-add {
            background: var(--blue);
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .btn-add:hover { opacity: 0.85; }

        .watchlist-list {
            overflow-y: auto;
            flex: 1;
        }

        .watchlist-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1.15rem;
            border-bottom: 1px solid rgba(31, 41, 61, 0.5);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .watchlist-row:hover {
            background: var(--bg-surface);
        }

        .watchlist-row.active {
            background: rgba(0, 163, 255, 0.12);
            border-left: 3px solid var(--blue);
        }

        .wl-symbol {
            font-family: var(--font-code);
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        .wl-quote {
            text-align: right;
            font-family: var(--font-code);
        }

        .wl-price {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .wl-change {
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 2px;
        }

        .text-green { color: var(--green); }
        .text-red { color: var(--red); }

        /* CHART VIEW */
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.85rem 1.25rem;
            background: rgba(20, 27, 45, 0.6);
            border-bottom: 1px solid var(--border);
        }

        .active-ticker-info {
            display: flex;
            align-items: baseline;
            gap: 0.85rem;
        }

        .symbol-display {
            font-family: var(--font-code);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .price-display {
            font-family: var(--font-code);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .change-display {
            font-family: var(--font-code);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .timeframe-selectors {
            display: flex;
            gap: 0.35rem;
            background: var(--bg-body);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .tf-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.3rem 0.75rem;
            border-radius: 5px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }

        .tf-btn.active, .tf-btn:hover {
            background: var(--bg-surface);
            color: var(--text-main);
        }

        .chart-container {
            flex: 1;
            min-height: 420px;
            position: relative;
        }

        /* TRADE TICKET */
        .order-form {
            padding: 1.15rem;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .form-control {
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.65rem 0.85rem;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 10px var(--blue-glow);
        }

        .mono { font-family: var(--font-code); }

        .trade-side-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
        }

        .side-btn {
            padding: 0.65rem;
            text-align: center;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-body);
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .side-btn input { display: none; }

        .side-btn.buy-side.active {
            background: var(--green-glow);
            border-color: var(--green);
            color: var(--green);
            box-shadow: 0 0 12px var(--green-glow);
        }

        .side-btn.sell-side.active {
            background: var(--red-glow);
            border-color: var(--red);
            color: var(--red);
            box-shadow: 0 0 12px var(--red-glow);
        }

        .order-summary {
            background: var(--bg-surface);
            padding: 0.85rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }

        .summary-row.font-bold {
            color: var(--text-main);
            font-weight: 800;
            font-size: 0.95rem;
            border-top: 1px solid var(--border);
            padding-top: 0.4rem;
        }

        .btn-submit {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            letter-spacing: 0.03em;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-buy {
            background: var(--green);
            color: #000;
            box-shadow: 0 0 15px var(--green-glow);
        }

        .btn-buy:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-sell {
            background: var(--red);
            color: #fff;
            box-shadow: 0 0 15px var(--red-glow);
        }

        .btn-sell:hover { opacity: 0.9; transform: translateY(-1px); }

        /* BOTTOM SECTION */
        .bottom-layout {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .tabs-header {
            display: flex;
            background: rgba(20, 27, 45, 0.6);
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            padding: 0.85rem 1.35rem;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.15s;
        }

        .tab-btn.active {
            color: var(--blue);
            border-bottom-color: var(--blue);
            background: rgba(0, 163, 255, 0.06);
        }

        .tab-content { display: none; padding: 1.25rem; }
        .tab-content.active { display: block; }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .data-table th {
            text-align: left;
            padding: 0.75rem 1rem;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        .data-table td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid rgba(31, 41, 61, 0.4);
            font-family: var(--font-code);
        }

        .btn-action-close {
            background: rgba(255, 51, 102, 0.15);
            border: 1px solid rgba(255, 51, 102, 0.3);
            color: var(--red);
            padding: 0.3rem 0.65rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-action-close:hover {
            background: var(--red);
            color: #fff;
        }

        /* BACKTEST SECTION */
        .backtest-form {
            display: flex;
            flex-wrap: wrap;
            gap: 0.85rem;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .form-inline {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .sm-input {
            width: 85px;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-family: var(--font-code);
            font-size: 0.85rem;
        }

        .btn-simulate {
            background: var(--blue);
            color: #fff;
            border: none;
            padding: 0.45rem 1rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 0 10px var(--blue-glow);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 0.85rem 1.15rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .stat-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .stat-val {
            font-family: var(--font-code);
            font-size: 1.35rem;
            font-weight: 800;
        }

        .chart-container-sm {
            height: 320px;
            background: var(--bg-body);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .hidden { display: none; }
        .text-center { text-align: center; }

        /* TOAST NOTIFICATIONS */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #151c2e;
            color: #fff;
            border: 1px solid var(--border);
            padding: 0.85rem 1.25rem;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            font-size: 0.9rem;
            font-weight: 600;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast-success { border-left: 4px solid var(--green); }
        .toast-error { border-left: 4px solid var(--red); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="nav-brand">
            <div class="logo-badge"><i class="fa-solid fa-chart-line"></i></div>
            <div class="logo-title">ALGO<span>TRADE</span> PRO</div>
            <div class="status-pill"><div class="pulse-dot"></div> PAPER LIVE</div>
            <nav class="nav-links">
                <a href="/" class="nav-link {% if request.path == '/' or request.path == '/api/index' %}active{% endif %}">
                    <i class="fa-solid fa-desktop"></i> Terminal
                </a>
                <a href="/bot" class="nav-link {% if request.path == '/bot' %}active{% endif %}">
                    <i class="fa-solid fa-robot"></i> NIFTY 50 Bot
                    <span class="bot-nav-dot"></span>
                </a>
            </nav>
        </div>
        <div class="nav-metrics">
            <div class="metric-box">
                <span class="metric-title">TOTAL PORTFOLIO EQUITY</span>
                <span class="metric-value text-green" id="nav-total-equity">₹10,00,000.00</span>
            </div>
            <div class="metric-box">
                <span class="metric-title">AVAILABLE CASH MARGIN</span>
                <span class="metric-value" id="nav-cash-balance">₹10,00,000.00</span>
            </div>
            <div class="metric-box">
                <span class="metric-title">5X BUYING POWER</span>
                <span class="metric-value text-green" id="nav-buying-power">₹50,00,000.00</span>
            </div>
            <div class="metric-box">
                <span class="metric-title">UNREALIZED P&amp;L</span>
                <span class="metric-value" id="nav-pnl">₹0.00</span>
            </div>
            <button id="reset-account-btn" class="btn-reset" style="background: rgba(255, 75, 75, 0.15); color: #ff7575; border: 1px solid rgba(255, 75, 75, 0.4); font-weight: 700; padding: 0.45rem 0.85rem;" title="Reset portfolio balance back to ₹10 Lakh (₹10,00,000)">
                <i class="fa-solid fa-rotate-left"></i> Reset to ₹10 Lakh
            </button>
        </div>
    </header>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <div id="toast-container" class="toast-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resetBtn = document.getElementById('reset-account-btn');
            if (resetBtn) {
                resetBtn.addEventListener('click', async () => {
                    if (!confirm('Reset paper desk to ₹10,00,000 cash and restore fresh NIFTY 50 watchlist?')) return;
                    try {
                        const res = await fetch('/api/reset-account', { method: 'POST' });
                        const data = await res.json();
                        if (data.success) {
                            document.getElementById('nav-total-equity').innerText = '₹10,00,000.00';
                            document.getElementById('nav-cash-balance').innerText = '₹10,00,000.00';
                            const bpEl = document.getElementById('nav-buying-power');
                            if (bpEl) bpEl.innerText = '₹50,00,000.00';
                            document.getElementById('nav-pnl').innerText = '₹0.00';
                            document.getElementById('nav-pnl').className = 'metric-value text-green';
                            
                            if (typeof loadPortfolio === 'function') loadPortfolio();
                            if (typeof loadBotHoldings === 'function') loadBotHoldings();
                            if (typeof loadClosedTradesReport === 'function') loadClosedTradesReport();
                            if (typeof fetchBotStatus === 'function') fetchBotStatus();
                            if (typeof loadWatchlist === 'function') loadWatchlist();
                            
                            if (typeof showToast === 'function') {
                                showToast('Desk reset to ₹10,00,000 cash capital!', 'success');
                            }
                        }
                    } catch (e) {
                        alert('Reset failed: ' + e);
                    }
                });
            }
        });
    </script>
</body>
</html>
